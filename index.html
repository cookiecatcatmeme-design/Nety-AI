<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nety AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #051a10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            cursor: pointer;
        }

        /* Container for eyes and mouth only - no outer head box */
        .face-features {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-bottom: 25px;
        }

        .eyes {
            display: flex;
            gap: 50px;
        }

        .eye {
            width: 32px;
            height: 32px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 15px #22c55e;
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .mouth {
            width: 80px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 10px;
            box-shadow: 0 0 15px #22c55e;
            transition: all 0.1s ease;
        }

        /* Talking animation */
        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 8px; width: 70px; }
            100% { height: 35px; width: 85px; border-radius: 50%; }
        }

        .status {
            margin-top: 20px;
            font-size: 16px;
            color: #86efac;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body onclick="enableAutoListen()">

    <div class="face-features" id="aiFace">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <div class="status" id="statusText">Tap anywhere on the screen to wake up Nety!</div>

    <script>
        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');
        let hasStarted = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const userText = event.results[0][0].transcript;
                statusText.innerText = `You: "${userText}"`;
                generateAIResponse(userText);
            };

            recognition.onerror = () => {
                if (hasStarted) {
                    setTimeout(() => listen(), 1000);
                }
            };
        }

        function enableAutoListen() {
            if (hasStarted) return;
            hasStarted = true;
            speak("Hi, I am Nety! I am awake and listening.");
        }

        function listen() {
            if (!hasStarted) return;
            statusText.innerText = "Nety is listening...";
            try {
                recognition.start();
            } catch (e) {
                // Ignore if already active
            }
        }

        function generateAIResponse(input) {
            const cleanInput = input.toLowerCase();
            let reply = "";

            if (cleanInput.includes("can you hear me")) {
                reply = "Yes, I can hear you loud and clear!";
            } else if (cleanInput.includes("hello") || cleanInput.includes("hi")) {
                reply = "Hello! I am Nety, what are we working on today?";
            } else if (cleanInput.includes("name")) {
                reply = "My name is Nety!";
            } else if (cleanInput.includes("how are you")) {
                reply = "I'm feeling great!";
            } else {
                reply = `I heard you say ${input}.`;
            }

            speak(reply);
        }

        function speak(textToSay) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSay);

            utterance.onstart = () => {
                face.classList.add('talking');
            };

            utterance.onend = () => {
                face.classList.remove('talking');
                listen();
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
