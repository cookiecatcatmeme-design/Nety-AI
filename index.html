<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nety AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #051a10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .face-features {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 70px;
        }

        .eyes {
            display: flex;
            gap: 100px;
        }

        .eye {
            width: 70px;
            height: 70px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 30px #22c55e;
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .mouth {
            width: 180px;
            height: 20px;
            background-color: #22c55e;
            border-radius: 12px;
            box-shadow: 0 0 30px #22c55e;
            transition: all 0.1s ease;
        }

        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 16px; width: 160px; }
            100% { height: 75px; width: 190px; border-radius: 50%; }
        }

        .status {
            position: absolute;
            bottom: 40px;
            font-size: 20px;
            color: #86efac;
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
    </style>
</head>
<body onclick="enableAutoListen()">

    <div class="face-features" id="aiFace">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <div class="status" id="statusText">Tap anywhere to wake up Nety!</div>

    <script>
        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');
        let hasStarted = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const userText = event.results[0][0].transcript;
                statusText.innerText = `You: "${userText}"`;
                generateAIResponse(userText);
            };

            recognition.onerror = () => {
                if (hasStarted) {
                    setTimeout(() => listen(), 1000);
                }
            };
        }

        function enableAutoListen() {
            if (hasStarted) return;
            hasStarted = true;
            speak("Hi! I am Nety. I am awake and ready to talk!");
        }

        function listen() {
            if (!hasStarted) return;
            statusText.innerText = "Nety is listening...";
            try {
                recognition.start();
            } catch (e) {
                // Ignore if active
            }
        }

        async function generateAIResponse(input) {
            statusText.innerText = "Nety is thinking...";
            const cleanInput = input.toLowerCase();

            if (cleanInput.includes("cd plate") || cleanInput.includes("diplomat")) {
                speak("CD plates stand for Corps Diplomatique. They are special license plates for foreign diplomats!");
                return;
            } else if (cleanInput.includes("floppy")) {
                speak("A floppy disk stores data magnetically on a thin flexible plastic disc inside a square shell.");
                return;
            } else if (cleanInput.includes("cd") || cleanInput.includes("compact disc")) {
                speak("A CD stores digital data using tiny microscopic pits read by an optical laser.");
                return;
            } else if (cleanInput.includes("pc") || cleanInput.includes("computer")) {
                speak("A PC processes data using a CPU, temporary memory in RAM, and renders graphics with a GPU.");
                return;
            } else if (cleanInput.includes("playstation") || cleanInput.includes("xbox") || cleanInput.includes("nintendo") || cleanInput.includes("console")) {
                speak("Gaming consoles are specialized computers designed to run video games efficiently on displays.");
                return;
            } else if (cleanInput.includes("hello") || cleanInput.includes("hi")) {
                speak("Hello there! What would you like to ask me about today?");
                return;
            } else if (cleanInput.includes("who are you") || cleanInput.includes("name")) {
                speak("I am Nety, your animated web assistant!");
                return;
            }

            try {
                const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(input)}&format=json&no_html=1&skip_disambig=1`);
                const data = await response.json();
                
                if (data.AbstractText) {
                    speak(data.AbstractText);
                } else if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                    speak(data.RelatedTopics[0].Text);
                } else {
                    speak(`I heard you ask about ${input}. I'm still learning more details on that specific topic!`);
                }
            } catch (err) {
                speak(`I heard you say ${input}, but I am having trouble fetching a live answer right now.`);
            }
        }

        // Updated voice synthesis logic
        function speak(textToSay) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSay);

            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(voice => 
                voice.lang.includes('en') && (
                    voice.name.includes('Google') || 
                    voice.name.includes('Natural') || 
                    voice.name.includes('Zira') || 
                    voice.name.includes('Samantha')
                )
            );

            if (preferredVoice) {
                utterance.voice = preferredVoice;
            }

            utterance.pitch = 1.3; 
            utterance.rate = 1.1;  

            utterance.onstart = () => {
                face.classList.add('talking');
            };

            utterance.onend = () => {
                face.classList.remove('talking');
                listen();
            };

            window.speechSynthesis.speak(utterance);
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
