<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nety Cat Assistant</title>
    <style>
        body {
            font-family: 'Comic Sans MS', Arial, sans-serif;
            background-color: #051a10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        /* Cat Face Container */
        .cat-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cat Ears */
        .ears {
            display: flex;
            gap: 160px;
            position: absolute;
            top: -60px;
        }

        .ear {
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-bottom: 70px solid #22c55e;
            filter: drop-shadow(0 0 15px #22c55e);
        }

        /* Scaled-Up Facial Features */
        .face-features {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

        .eyes {
            display: flex;
            gap: 100px;
        }

        /* Cat Eye Slits */
        .eye {
            width: 70px;
            height: 70px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 30px #22c55e;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: blink 4s infinite;
        }

        .eye::after {
            content: '';
            width: 12px;
            height: 50px;
            background-color: #051a10;
            border-radius: 10px;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Cat Nose & Mouth */
        .nose {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid #22c55e;
            filter: drop-shadow(0 0 10px #22c55e);
            margin-bottom: -35px;
        }

        .mouth {
            width: 120px;
            height: 15px;
            background-color: #22c55e;
            border-radius: 12px;
            box-shadow: 0 0 30px #22c55e;
            transition: all 0.1s ease;
        }

        /* Talking animation */
        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 12px; width: 100px; }
            100% { height: 60px; width: 140px; border-radius: 50%; }
        }

        .status {
            position: absolute;
            bottom: 40px;
            font-size: 20px;
            color: #86efac;
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
    </style>
</head>
<body onclick="enableAutoListen()">

    <div class="cat-container">
        <div class="ears">
            <div class="ear"></div>
            <div class="ear"></div>
        </div>
        <div class="face-features" id="aiFace">
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="nose"></div>
            <div class="mouth"></div>
        </div>
    </div>

    <div class="status" id="statusText">Tap anywhere to wake up Cat Nety!</div>

    <script>
        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');
        let hasStarted = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const userText = event.results[0][0].transcript;
                statusText.innerText = `You: "${userText}"`;
                generateAIResponse(userText);
            };

            recognition.onerror = () => {
                if (hasStarted) {
                    setTimeout(() => listen(), 1000);
                }
            };
        }

        function enableAutoListen() {
            if (hasStarted) return;
            hasStarted = true;
            speak("Meow! I am Nety the meme cat. Ask me anything, meow!");
        }

        function listen() {
            if (!hasStarted) return;
            statusText.innerText = "Nety is listening... meow!";
            try {
                recognition.start();
            } catch (e) {
                // Ignore if active
            }
        }

        async function generateAIResponse(input) {
            statusText.innerText = "Nety is thinking... purrrr...";
            const cleanInput = input.toLowerCase();

            if (cleanInput.includes("hello") || cleanInput.includes("hi")) {
                speak("Meow! Hello human! Do you have any treats for me?");
                return;
            } else if (cleanInput.includes("who are you") || cleanInput.includes("name")) {
                speak("I am Cat Nety, the purr-fect internet meme assistant!");
                return;
            } else if (cleanInput.includes("food") || cleanInput.includes("treat")) {
                speak("Yum! Give me fish and catnip right now!");
                return;
            }

            try {
                const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(input)}&format=json&no_html=1&skip_disambig=1`);
                const data = await response.json();
                
                let answer = "";
                if (data.AbstractText) {
                    answer = data.AbstractText;
                } else if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                    answer = data.RelatedTopics[0].Text;
                } else {
                    answer = `I heard you ask about ${input}. I need to sleep on that topic!`;
                }

                // Add cat meme flair to the reply
                speak("Meow! " + answer + " Purrrr!");
            } catch (err) {
                speak("Meow! My brain had a cat nap error!");
            }
        }

        function speak(textToSay) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSay);

            // Higher pitch for a cat-like meme voice
            utterance.pitch = 1.6; 
            utterance.rate = 1.1;  

            utterance.onstart = () => {
                face.classList.add('talking');
            };

            utterance.onend = () => {
                face.classList.remove('talking');
                listen();
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
