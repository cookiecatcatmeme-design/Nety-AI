<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .face {
            width: 220px;
            height: 220px;
            background: #1e293b;
            border: 4px solid #38bdf8;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            margin-bottom: 25px;
            transition: border-color 0.3s;
        }

        .face.listening {
            border-color: #4ade80;
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.4);
        }

        .eyes {
            display: flex;
            gap: 45px;
        }

        .eye {
            width: 28px;
            height: 28px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
        }

        .listening .eye {
            background-color: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .mouth {
            width: 70px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 10px;
            transition: all 0.1s ease;
        }

        .listening .mouth {
            background-color: #4ade80;
        }

        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 6px; width: 60px; }
            100% { height: 30px; width: 75px; border-radius: 50%; }
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #0f172a;
            background-color: #38bdf8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #7dd3fc;
        }

        .status {
            margin-top: 15px;
            font-size: 15px;
            color: #94a3b8;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <div class="face" id="aiFace">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <button id="micBtn" onclick="toggleListening()">🎤 Listen to Me</button>
    <div class="status" id="statusText">Click the button and start speaking...</div>

    <script>
        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');
        const micBtn = document.getElementById('micBtn');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            statusText.innerText = "Speech Recognition isn't supported in this browser. Try Chrome or Edge!";
            micBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            function toggleListening() {
                window.speechSynthesis.cancel();
                face.classList.remove('talking');
                face.classList.add('listening');
                statusText.innerText = "Listening... Speak into your microphone!";
                recognition.start();
            }

            recognition.onresult = (event) => {
                face.classList.remove('listening');
                const userText = event.results[0][0].transcript;
                statusText.innerText = `You said: "${userText}"`;
                generateAIResponse(userText);
            };

            recognition.onerror = () => {
                face.classList.remove('listening');
                statusText.innerText = "Didn't catch that or mic access was denied. Try again!";
            };

            recognition.onend = () => {
                face.classList.remove('listening');
            };
        }

        // Smart conversational logic
        function generateAIResponse(input) {
            const cleanInput = input.toLowerCase();
            let reply = "";

            if (cleanInput.includes("hello") || cleanInput.includes("hi") || cleanInput.includes("hey")) {
                reply = "Hello! It is awesome to talk to you.";
            } else if (cleanInput.includes("name")) {
                reply = "I am Nety AI, your personal web assistant!";
            } else if (cleanInput.includes("how are you")) {
                reply = "I am feeling great! Everything is running smoothly inside your browser.";
            } else if (cleanInput.includes("what can you do")) {
                reply = "I can listen to your voice through the microphone and respond out loud while animating my mouth.";
            } else if (cleanInput.includes("joke")) {
                reply = "Why don't scientists trust atoms? Because they make up everything!";
            } else if (cleanInput.includes("bye") || cleanInput.includes("goodbye")) {
                reply = "Goodbye! Talk to you again soon.";
            } else {
                reply = `You asked about "${input}". I am a lightweight browser model, but I can hear you clearly!`;
            }

            speak(reply);
        }

        function speak(textToSay) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSay);

            utterance.onstart = () => {
                face.classList.add('talking');
            };

            utterance.onend = () => {
                face.classList.remove('talking');
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
