<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nety AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #051a10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .face-features {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 70px;
        }

        .eyes {
            display: flex;
            gap: 100px;
        }

        .eye {
            width: 70px;
            height: 70px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 30px #22c55e;
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .mouth {
            width: 180px;
            height: 20px;
            background-color: #22c55e;
            border-radius: 12px;
            box-shadow: 0 0 30px #22c55e;
            transition: all 0.1s ease;
        }

        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 16px; width: 160px; }
            100% { height: 75px; width: 190px; border-radius: 50%; }
        }

        .status {
            position: absolute;
            bottom: 40px;
            font-size: 20px;
            color: #86efac;
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
    </style>
</head>
<body onclick="enableAutoListen()">

    <div class="face-features" id="aiFace">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <div class="status" id="statusText">Tap anywhere to wake up Nety!</div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.14.0';
        
        // Disable local model check to prevent CORS errors on GitHub Pages
        env.allowLocalModels = false;

        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');
        let hasStarted = false;
        let generator = null;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const userText = event.results[0][0].transcript;
                statusText.innerText = `You: "${userText}"`;
                generateAIResponse(userText);
            };

            recognition.onerror = () => {
                if (hasStarted && generator) {
                    setTimeout(() => listen(), 1000);
                }
            };
        }

        window.enableAutoListen = async function() {
            if (hasStarted) return;
            hasStarted = true;
            statusText.innerText = "Loading Nety's AI brain... (First time takes ~10 seconds)";

            try {
                // Using an ultra-light model specifically built for WebAssembly in pure HTML
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat');
                speak("Hi! I am Nety. My local brain is fully loaded!");
            } catch (e) {
                console.error(e);
                statusText.innerText = "Error loading local brain. Try refreshing or use the Groq API version!";
            }
        };

        function listen() {
            if (!hasStarted) return;
            statusText.innerText = "Nety is listening...";
            try {
                recognition.start();
            } catch (e) {
                // Ignore if active
            }
        }

        async function generateAIResponse(input) {
            if (!generator) return;
            statusText.innerText = "Nety is thinking...";

            try {
                const messages = [
                    { role: "system", content: "You are Nety. Give very short 1-sentence answers." },
                    { role: "user", content: input }
                ];
                
                const output = await generator(messages, { max_new_tokens: 30 });
                let reply = output[0].generated_text.at(-1).content;
                speak(reply);
            } catch (error) {
                speak("I had trouble generating a reply.");
            }
        }

        function speak(textToSay) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSay);

            utterance.onstart = () => {
                face.classList.add('talking');
            };

            utterance.onend = () => {
                face.classList.remove('talking');
                listen();
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
