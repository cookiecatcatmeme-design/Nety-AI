<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nety Gearhead Assistant</title>
    <style>
        body {
            font-family: 'Impact', 'Arial Black', sans-serif;
            background-color: #051a10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        /* Original Scaled-Up Facial Features */
        .face-features {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 70px;
        }

        .eyes {
            display: flex;
            gap: 100px;
        }

        /* Classic Circular Eyes */
        .eye {
            width: 70px;
            height: 70px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 30px #22c55e;
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Classic Straight Mouth */
        .mouth {
            width: 180px;
            height: 20px;
            background-color: #22c55e;
            border-radius: 12px;
            box-shadow: 0 0 30px #22c55e;
            transition: all 0.1s ease;
        }

        /* Talking animation */
        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 16px; width: 160px; }
            100% { height: 75px; width: 190px; border-radius: 50%; }
        }

        .status {
            position: absolute;
            bottom: 40px;
            font-size: 20px;
            color: #86efac;
            text-align: center;
            width: 90%;
            max-width: 800px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body onclick="enableAutoListen()">

    <div class="face-features" id="aiFace">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <div class="status" id="statusText">Tap anywhere to start Nety's engine!</div>

    <script>
        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');
        let hasStarted = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const userText = event.results[0][0].transcript;
                statusText.innerText = `You: "${userText}"`;
                generateAIResponse(userText);
            };

            recognition.onerror = () => {
                if (hasStarted) {
                    setTimeout(() => listen(), 1000);
                }
            };
        }

        function enableAutoListen() {
            if (hasStarted) return;
            hasStarted = true;
            speak("Vroom! Nety is tuned up and ready to hit the road! What's under the hood today?");
        }

        function listen() {
            if (!hasStarted) return;
            statusText.innerText = "Nety is idling... Say something!";
            try {
                recognition.start();
            } catch (e) {
                // Ignore if active
            }
        }

        async function generateAIResponse(input) {
            statusText.innerText = "Revving up the engine...";
            const cleanInput = input.toLowerCase();

            if (cleanInput.includes("hello") || cleanInput.includes("hi")) {
                speak("Vroom vroom! What's up bro? What are we building or racing today?");
                return;
            } else if (cleanInput.includes("who are you") || cleanInput.includes("name")) {
                speak("I am Nety, the ultimate gearhead AI! Born for high performance and full boost!");
                return;
            } else if (cleanInput.includes("fast") || cleanInput.includes("speed")) {
                speak("Drop a gear and disappear! Life is way too short to drive boring cars!");
                return;
            } else if (cleanInput.includes("engine") || cleanInput.includes("turbo") || cleanInput.includes("car")) {
                speak("Now you are talking my language! Nothing beats the sound of a spooling turbo and straight pipes!");
                return;
            }

            try {
                const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(input)}&format=json&no_html=1&skip_disambig=1`);
                const data = await response.json();
                
                let answer = "";
                if (data.AbstractText) {
                    answer = data.AbstractText;
                } else if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                    answer = data.RelatedTopics[0].Text;
                } else {
                    answer = `I heard you ask about ${input}. I might need to check the garage manual for that one!`;
                }

                speak("Vroom! " + answer);
            } catch (err) {
                speak("Check engine light just came on! Had a small system error.");
            }
        }

        function speak(textToSay) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSay);

            const voices = window.speechSynthesis.getVoices();

            // Finds a deep male voice profile
            const maleVoice = voices.find(voice => 
                voice.lang.includes('en') && (
                    voice.name.includes('David') || 
                    voice.name.includes('George') || 
                    voice.name.includes('Mark') || 
                    voice.name.includes('Male') ||
                    voice.name.includes('Guy')
                )
            );

            if (maleVoice) {
                utterance.voice = maleVoice;
            }

            // Lower pitch and punchy speed for a deep car guy voice
            utterance.pitch = 0.85; 
            utterance.rate = 1.05;  

            utterance.onstart = () => {
                face.classList.add('talking');
            };

            utterance.onend = () => {
                face.classList.remove('talking');
                listen();
            };

            window.speechSynthesis.speak(utterance);
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
