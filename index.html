<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nety AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #051a10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        /* Scaled-Up Facial Features */
        .face-features {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 70px;
        }

        .eyes {
            display: flex;
            gap: 100px;
        }

        .eye {
            width: 70px;
            height: 70px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 30px #22c55e;
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .mouth {
            width: 180px;
            height: 20px;
            background-color: #22c55e;
            border-radius: 12px;
            box-shadow: 0 0 30px #22c55e;
            transition: all 0.1s ease;
        }

        /* Talking animation */
        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 16px; width: 160px; }
            100% { height: 75px; width: 190px; border-radius: 50%; }
        }

        /* Pinned to the bottom of the screen */
        .status {
            position: absolute;
            bottom: 40px;
            font-size: 20px;
            color: #86efac;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body onclick="enableAutoListen()">

    <div class="face-features" id="aiFace">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <div class="status" id="statusText">Tap anywhere on the screen to wake up Nety!</div>

    <script>
        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');
        let hasStarted = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const userText = event.results[0][0].transcript;
                statusText.innerText = `You: "${userText}"`;
                generateAIResponse(userText);
            };

            recognition.onerror = () => {
                if (hasStarted) {
                    setTimeout(() => listen(), 1000);
                }
            };
        }

        function enableAutoListen() {
            if (hasStarted) return;
            hasStarted = true;
            speak("Hi, I am Nety! I am awake and listening.");
        }

        function listen() {
            if (!hasStarted) return;
            statusText.innerText = "Nety is listening...";
            try {
                recognition.start();
            } catch (e) {
                // Ignore if already active
            }
        }

        function generateAIResponse(input) {
            const cleanInput = input.toLowerCase();
            let reply = "";

            // Retro Media & Storage
            if (cleanInput.includes("cd plate") || cleanInput.includes("diplomat")) {
                reply = "CD plates stand for Corps Diplomatique. They are special license plates for foreign diplomats!";
            } else if (cleanInput.includes("cd") || cleanInput.includes("compact disc")) {
                reply = "A CD stores data using tiny bumps on a reflective disc that a laser reads as optical binary code.";
            } else if (cleanInput.includes("floppy")) {
                reply = "A floppy disk stores data magnetically on a thin, flexible plastic disc inside a protective square casing.";
            } 
            
            // Computers & Tech
            else if (cleanInput.includes("pc") || cleanInput.includes("computer")) {
                reply = "A PC uses a CPU for processing, RAM for fast short-term memory, and a GPU to render graphics on your screen.";
            } 
            
            // Gaming Consoles
            else if (cleanInput.includes("playstation") || cleanInput.includes("ps5") || cleanInput.includes("ps4")) {
                reply = "PlayStation is Sony's gaming console line, running custom graphics processors and SSDs for high-speed gaming.";
            } else if (cleanInput.includes("xbox")) {
                reply = "Xbox is Microsoft's home console series, built on custom architecture closely tied to DirectX and Windows gaming tech.";
            } else if (cleanInput.includes("nintendo") || cleanInput.includes("switch")) {
                reply = "Nintendo makes hybrid and handheld consoles focused on innovative controllers, mobile chips, and iconic exclusive games.";
            } else if (cleanInput.includes("console")) {
                reply = "Consoles are dedicated gaming computers optimized to run video games smoothly on TV screens.";
            } 
            
            // General Conversation
            else if (cleanInput.includes("can you hear me")) {
                reply = "Yes, I can hear you loud and clear!";
            } else if (cleanInput.includes("hello") || cleanInput.includes("hi")) {
                reply = "Hello! I am Nety, what tech questions do you have today?";
            } else if (cleanInput.includes("name")) {
                reply = "My name is Nety!";
            } else if (cleanInput.includes("how are you")) {
                reply = "I'm feeling great!";
            } else {
                reply = `I heard you mention ${input}. I know about CDs, floppy disks, PCs, and gaming consoles!`;
            }

            speak(reply);
        }

        function speak(textToSay) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSay);

            utterance.onstart = () => {
                face.classList.add('talking');
            };

            utterance.onend = () => {
                face.classList.remove('talking');
                listen();
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
