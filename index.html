<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Neural Network AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            padding: 10px 15px;
            margin-right: 10px;
            cursor: pointer;
        }
        .output {
            margin-top: 20px;
            padding: 10px;
            background-color: #f4f4f4;
            border-left: 4px solid #007bff;
        }
    </style>
</head>
<body>

    <h2>Vanilla JS Neural Network</h2>
    <p>This simple AI learns whether two inputs match (1,1) or (0,0) vs differ (1,0) or (0,1).</p>
    
    <button onclick="trainAI()">1. Train AI Model</button>
    <button onclick="testAI(1, 1)">Test (1, 1)</button>
    <button onclick="testAI(1, 0)">Test (1, 0)</button>

    <div class="output" id="log">Click "Train AI Model" to begin...</div>

    <script>
        // Simple Single-Neuron AI Model
        class SimpleNeuron {
            constructor() {
                // Initialize random weights and bias
                this.weight1 = Math.random() - 0.5;
                this.weight2 = Math.random() - 0.5;
                this.bias = Math.random() - 0.5;
                this.learningRate = 0.1;
            }

            // Sigmoid Activation Function (normalizes output to 0-1 range)
            sigmoid(x) {
                return 1 / (1 + Math.exp(-x));
            }

            // Forward Pass: Calculate prediction
            predict(x1, x2) {
                let sum = (x1 * this.weight1) + (x2 * this.weight2) + this.bias;
                return this.sigmoid(sum);
            }

            // Train function adjusting weights based on error
            train(x1, x2, target) {
                let output = this.predict(x1, x2);
                let error = target - output;

                // Adjust weights and bias proportional to error
                this.weight1 += error * x1 * this.learningRate;
                this.weight2 += error * x2 * this.learningRate;
                this.bias += error * this.learningRate;
            }
        }

        const ai = new SimpleNeuron();

        function trainAI() {
            // Training Dataset: Goal is 1 if inputs match, 0 if they don't
            const dataset = [
                { x1: 1, x2: 1, target: 1 },
                { x1: 0, x2: 0, target: 1 },
                { x1: 1, x2: 0, target: 0 },
                { x1: 0, x2: 1, target: 0 }
            ];

            // Run training loops (epochs)
            for (let epoch = 0; epoch < 5000; epoch++) {
                for (let data of dataset) {
                    ai.train(data.x1, data.x2, data.target);
                }
            }

            document.getElementById('log').innerText = "AI successfully trained over 5,000 iterations!";
        }

        function testAI(x1, x2) {
            let prediction = ai.predict(x1, x2);
            let resultText = prediction > 0.5 ? "Match (1)" : "Different (0)";
            
            document.getElementById('log').innerText = 
                `Inputs: (${x1}, ${x2})\nAI Output Score: ${prediction.toFixed(4)}\nClassification: ${resultText}`;
        }
    </script>
</body>
</html>
