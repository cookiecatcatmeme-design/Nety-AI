<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nety AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #051a10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        /* Scaled-Up Facial Features */
        .face-features {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 70px;
        }

        .eyes {
            display: flex;
            gap: 100px;
        }

        .eye {
            width: 70px;
            height: 70px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 30px #22c55e;
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .mouth {
            width: 180px;
            height: 20px;
            background-color: #22c55e;
            border-radius: 12px;
            box-shadow: 0 0 30px #22c55e;
            transition: all 0.1s ease;
        }

        /* Talking animation */
        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 16px; width: 160px; }
            100% { height: 75px; width: 190px; border-radius: 50%; }
        }

        /* Status pinned to bottom */
        .status {
            position: absolute;
            bottom: 40px;
            font-size: 20px;
            color: #86efac;
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
    </style>
    <!-- Load Transformers.js directly via CDN -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.14.0';
        window.pipeline = pipeline;
    </script>
</head>
<body onclick="enableAutoListen()">

    <div class="face-features" id="aiFace">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <div class="status" id="statusText">Tap anywhere to start loading Nety's brain!</div>

    <script>
        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');
        let hasStarted = false;
        let generator = null;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const userText = event.results[0][0].transcript;
                statusText.innerText = `You: "${userText}"`;
                generateAIResponse(userText);
            };

            recognition.onerror = () => {
                if (hasStarted && generator) {
                    setTimeout(() => listen(), 1000);
                }
            };
        }

        async function enableAutoListen() {
            if (hasStarted) return;
            hasStarted = true;
            statusText.innerText = "Loading Nety's AI brain into browser... Please wait!";

            try {
                // Initialize the in-browser AI pipeline
                generator = await window.pipeline('text-generation', 'Xenova/LaMini-Flan-T5-78M');
                speak("Hi, I am Nety! My local AI brain is ready. What do you want to talk about?");
            } catch (e) {
                statusText.innerText = "Error loading local AI brain.";
            }
        }

        function listen() {
            if (!hasStarted) return;
            statusText.innerText = "Nety is listening...";
            try {
                recognition.start();
            } catch (e) {
                // Ignore if active
            }
        }

        async function generateAIResponse(input) {
            if (!generator) return;
            statusText.innerText = "Nety is thinking locally...";

            try {
                const prompt = `Answer the user question concisely in 1 sentence: ${input}`;
                const output = await generator(prompt, { max_new_tokens: 40 });
                const reply = output[0].generated_text;
                speak(reply);
            } catch (error) {
                speak("Sorry, I had trouble processing that locally.");
            }
        }

        function speak(textToSay) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSay);

            utterance.onstart = () => {
                face.classList.add('talking');
            };

            utterance.onend = () => {
                face.classList.remove('talking');
                listen();
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
