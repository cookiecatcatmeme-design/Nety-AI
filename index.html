<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Face</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* Animated Robot Face */
        .face {
            width: 220px;
            height: 220px;
            background: #1e293b;
            border: 4px solid #38bdf8;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            margin-bottom: 25px;
        }

        .eyes {
            display: flex;
            gap: 45px;
        }

        .eye {
            width: 28px;
            height: 28px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
        }

        .mouth {
            width: 70px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 10px;
            transition: all 0.1s ease;
        }

        /* Animation when AI speaks */
        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 6px; width: 60px; }
            100% { height: 30px; width: 75px; border-radius: 50%; }
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #0f172a;
            background-color: #38bdf8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #7dd3fc;
        }

        .status {
            margin-top: 15px;
            font-size: 15px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="face" id="aiFace">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <button onclick="talkToUser()">🎤 Speak to AI</button>
    <div class="status" id="statusText">Click the button to make the AI talk!</div>

    <script>
        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');

        function talkToUser() {
            const phrases = [
                "Hello! I am your visual AI assistant.",
                "I am running right inside your website!",
                "Nice to meet you! How can I help today?",
                "My face animates whenever I speak using browser code."
            ];

            // Pick a random line to say
            const response = phrases[Math.floor(Math.random() * phrases.length)];
            speak(response);
        }

        function speak(textToSay) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSay);

            // Start mouth animation when talking
            utterance.onstart = () => {
                face.classList.add('talking');
                statusText.innerText = `AI Speaking: "${textToSay}"`;
            };

            // Stop mouth animation when finished
            utterance.onend = () => {
                face.classList.remove('talking');
                statusText.innerText = "Click the button to talk again!";
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
