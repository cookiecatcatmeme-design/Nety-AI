<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Face</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* Animated Robot/AI Face */
        .face {
            width: 200px;
            height: 200px;
            background: #1e1e1e;
            border: 4px solid #00d2ff;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            margin-bottom: 30px;
        }

        .eyes {
            display: flex;
            gap: 40px;
        }

        .eye {
            width: 25px;
            height: 25px;
            background-color: #00d2ff;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .mouth {
            width: 60px;
            height: 8px;
            background-color: #00d2ff;
            border-radius: 10px;
            transition: height 0.1s, width 0.1s;
        }

        /* Speaking Animation Class */
        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 6px; width: 50px; }
            100% { height: 25px; width: 65px; border-radius: 50%; }
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #00d2ff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 210, 255, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="face" id="aiFace">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <button onclick="startListening()">🎤 Speak to AI</button>
    <div class="status" id="statusText">Click the button and say something...</div>

    <script>
        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');

        // Set up Web Speech API Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "Speech Recognition is not supported in this browser. Try Chrome or Edge.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';

            function startListening() {
                statusText.innerText = "Listening...";
                recognition.start();
            }

            recognition.onresult = (event) => {
                const userSpeech = event.results[0][0].transcript;
                statusText.innerText = `You said: "${userSpeech}"`;
                respondToUser(userSpeech);
            };

            recognition.onerror = () => {
                statusText.innerText = "Error recognizing speech. Try again.";
            };
        }

        // Basic Response Rules + Text-to-Speech Output
        function respondToUser(text) {
            let response = "I heard you say " + text;
            const input = text.toLowerCase();

            if (input.includes("hello") || input.includes("hi")) {
                response = "Hello there! How can I help you today?";
            } else if (input.includes("your name")) {
                response = "I am your custom browser AI assistant.";
            } else if (input.includes("how are you")) {
                response = "I am doing great, running smoothly inside your browser!";
            }

            speak(response);
        }

        function speak(textToSay) {
            // Cancel ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(textToSay);
            
            // Animate mouth when AI starts speaking
            utterance.onstart = () => {
                face.classList.add('talking');
            };

            // Stop mouth animation when finished
            utterance.onend = () => {
                face.classList.remove('talking');
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
