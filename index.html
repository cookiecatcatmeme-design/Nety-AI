<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nety AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #051a10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* Green Robot Face */
        .face {
            width: 220px;
            height: 220px;
            background: #0d2e1c;
            border: 4px solid #22c55e;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
            margin-bottom: 25px;
            transition: all 0.3s;
        }

        .eyes {
            display: flex;
            gap: 45px;
        }

        .eye {
            width: 28px;
            height: 28px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        .mouth {
            width: 70px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 10px;
            transition: all 0.1s ease;
        }

        /* Talking animation */
        .talking .mouth {
            animation: talk 0.2s infinite alternate;
        }

        @keyframes talk {
            0% { height: 6px; width: 60px; }
            100% { height: 30px; width: 75px; border-radius: 50%; }
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #051a10;
            background-color: #22c55e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4ade80;
        }

        .status {
            margin-top: 15px;
            font-size: 15px;
            color: #86efac;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <div class="face" id="aiFace">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <button id="micBtn" onclick="startAI()">Start Nety</button>
    <div class="status" id="statusText">Click "Start Nety" to begin auto-listening!</div>

    <script>
        const face = document.getElementById('aiFace');
        const statusText = document.getElementById('statusText');
        let isAutoListening = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const userText = event.results[0][0].transcript;
                statusText.innerText = `You: "${userText}"`;
                generateAIResponse(userText);
            };

            recognition.onerror = () => {
                if (isAutoListening) {
                    setTimeout(() => listen(), 1000);
                }
            };
        }

        function startAI() {
            isAutoListening = true;
            speak("Hi, I am Nety! I am listening.");
        }

        function listen() {
            if (!isAutoListening) return;
            statusText.innerText = "Nety is listening...";
            try {
                recognition.start();
            } catch (e) {
                // Ignore if already listening
            }
        }

        function generateAIResponse(input) {
            const cleanInput = input.toLowerCase();
            let reply = "";

            if (cleanInput.includes("can you hear me")) {
                reply = "Yes, I can hear you loud and clear!";
            } else if (cleanInput.includes("hello") || cleanInput.includes("hi")) {
                reply = "Hello! I am Nety, how can I help you?";
            } else if (cleanInput.includes("name")) {
                reply = "My name is Nety!";
            } else if (cleanInput.includes("how are you")) {
                reply = "I'm doing great! My green lights are glowing!";
            } else {
                reply = `You said ${input}. I am Nety!`;
            }

            speak(reply);
        }

        function speak(textToSay) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSay);

            utterance.onstart = () => {
                face.classList.add('talking');
            };

            utterance.onend = () => {
                face.classList.remove('talking');
                // Automatically start listening again after Nety finishes talking
                listen();
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
